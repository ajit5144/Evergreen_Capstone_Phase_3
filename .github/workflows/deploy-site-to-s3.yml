name: Deploy Evergreen Site to S3

on:
  workflow_run:
    workflows: ["Test AWS Authentication"]
    types: [completed]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: evergreen-site-s3-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy after CI and authentication
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04

    steps:
      - name: Download tested deployment source
        uses: actions/download-artifact@v4
        with:
          name: deployment-source
          path: deployment-source
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate deployment source
        id: source
        run: |
          SHA=$(jq -er '.sha' deployment-source/source.json)
          BRANCH=$(jq -er '.branch' deployment-source/source.json)

          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BRANCH" == "main" || "$BRANCH" == "feature_branch" ]]

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying tested commit: $SHA"
          echo "Source branch: $BRANCH"

      - name: Check out the tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Validate site files
        run: test -f starter/site/index.html

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: GitHubSiteDeploy-${{ github.run_id }}

      - name: Preview deployment changes
        run: |
          aws s3 sync starter/site/ \
            s3://evergreen-quote-site-ajit-v001 \
            --delete --dryrun --region us-east-2

      - name: Deploy website
        run: |
          aws s3 sync starter/site/ \
            s3://evergreen-quote-site-ajit-v001 \
            --delete --region us-east-2

      - name: Verify uploaded files
        run: |
          aws s3 ls s3://evergreen-quote-site-ajit-v001 \
            --recursive --human-readable --region us-east-2
