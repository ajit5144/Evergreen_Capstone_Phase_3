# ci.yml - the Evergreen Quote API pipeline (provided).
# Capstone learners: enable this by copying it to .github/workflows/ci.yml in
# your repository. Do not modify it.
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test the API
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: evergreen_capstone_phase_3/starter/package-lock.json

      - name: Install dependencies from the lock file
        working-directory: evergreen_capstone_phase_3/starter
        run: npm ci

      - name: Run the API tests (the safety net)
        working-directory: evergreen_capstone_phase_3/starter
        run: npm test
